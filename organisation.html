<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vérification – EPIK Leaders</title>
<style>
:root{--navy:#0b2a55;--ok:#157347;--ko:#b42318;--bg:#f3f5f9}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1c2430;padding:16px}
.card{background:#fff;max-width:460px;width:100%;border-radius:16px;box-shadow:0 8px 30px rgba(11,42,85,.12);padding:32px 24px;text-align:center;border-top:6px solid var(--navy)}
.brand{font-weight:700;letter-spacing:.08em;color:var(--navy);font-size:14px;margin-bottom:20px}
.status{font-size:22px;font-weight:700;margin:8px 0 18px}
.ok{color:var(--ok)}.ko{color:var(--ko)}
.name{font-size:26px;font-weight:700;color:var(--navy);margin:6px 0}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#667085;margin-top:18px}
.val{font-size:16px;margin-top:4px}
form{margin-top:26px;text-align:left;border-top:1px solid #e4e7ec;padding-top:20px}
form h2{font-size:14px;color:var(--navy);margin:0 0 12px;text-align:center}
label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#667085;margin:12px 0 4px}
input{width:100%;padding:11px 12px;border:1px solid #cfd4dc;border-radius:10px;font-size:16px;font-family:inherit}
input:focus{outline:2px solid var(--navy);border-color:transparent}
button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
.hint{font-size:12px;color:#667085;margin-top:8px;text-align:center}
.serial{margin-top:22px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:#667085;word-break:break-all}
</style>
</head>
<body>
<div class="card">
  <div class="brand">EPIK LEADERS · ENCG AGADIR</div>
  <div id="out"></div>
  <form id="f" autocomplete="off">
    <h2>Vérifier manuellement</h2>
    <label for="code">N° de série</label>
    <input id="code" placeholder="EPIK-ORG-2026-001" autocapitalize="characters" spellcheck="false">
    <label for="nm">Nom et prénom</label>
    <input id="nm" placeholder="Ex : Asaad Chakir">
    <button type="submit">Vérifier</button>
    <div class="hint">Saisissez le n° de série, le nom, ou les deux.</div>
  </form>
</div>
<script>
var TYPE = "Participation à l’organisation de l’EPIK Business Forum – 1ère édition";
var SP = "Sponsoring & Partnership", OR = "Organization", MK = "Marketing", ER = "External Relations";
var MC = "Master of Ceremonies", MD = "Moderator";
var REGISTRY = {
  "EPIK-ORG-2026-001": {name: "Asaad Chakir", team: SP},
  "EPIK-ORG-2026-002": {name: "Chaouch Wissal", team: SP},
  "EPIK-ORG-2026-003": {name: "Diab Ilham", team: SP},
  "EPIK-ORG-2026-004": {name: "El Mansouri Ayoub", team: SP},
  "EPIK-ORG-2026-005": {name: "Chouaf Ikbal", team: SP},
  "EPIK-ORG-2026-006": {name: "Korsan Wassim", team: SP},
  "EPIK-ORG-2026-007": {name: "Touil Youssef", team: OR},
  "EPIK-ORG-2026-008": {name: "Zitouni Adam", team: OR},
  "EPIK-ORG-2026-009": {name: "El Qara Ismail", team: OR},
  "EPIK-ORG-2026-010": {name: "Mejdaoui Mohamed", team: OR},
  "EPIK-ORG-2026-011": {name: "Saadi Ismail", team: OR},
  "EPIK-ORG-2026-012": {name: "Zaafane Douae", team: OR},
  "EPIK-ORG-2026-013": {name: "Sanfi Nassim", team: OR},
  "EPIK-ORG-2026-014": {name: "Bahamou Zakaria", team: OR},
  "EPIK-ORG-2026-015": {name: "Aguechoul Rayan", team: OR},
  "EPIK-ORG-2026-016": {name: "Sabour El Idrissi Abdelhamid", team: OR},
  "EPIK-ORG-2026-017": {name: "Balaoui Oussama", team: OR},
  "EPIK-ORG-2026-018": {name: "Bencheikh Hiba", team: OR},
  "EPIK-ORG-2026-019": {name: "Olhour Zineb", team: OR},
  "EPIK-ORG-2026-020": {name: "Belkahia Ibtissam", team: OR},
  "EPIK-ORG-2026-021": {name: "Yacoubi Fatima Azzahrae", team: OR},
  "EPIK-ORG-2026-022": {name: "Attouche Riham", team: MK},
  "EPIK-ORG-2026-023": {name: "Al Hargoum Aya", team: MK},

  "EPIK-ORG-2026-030": {name: "El Khomri Aya", team: MK},
  "EPIK-ORG-2026-031": {name: "Idmhand Fatima Ezzahra", team: MK},
  "EPIK-ORG-2026-032": {name: "Ouomar Ikram", team: MK},
  "EPIK-ORG-2026-033": {name: "M’hamd Benabdelkader", team: MK},
  "EPIK-ORG-2026-034": {name: "Rbihi Najwa", team: MK},
  "EPIK-ORG-2026-035": {name: "Zebbara Najwa", team: MK},

  "EPIK-ORG-2026-038": {name: "Kamouch Hiba", team: ER},
  "EPIK-ORG-2026-039": {name: "Hmimaz Siham", team: ER},
  "EPIK-ORG-2026-040": {name: "Kaoutar Tita", role: MC},
  "EPIK-ORG-2026-041": {name: "Mohamed Belghmidi", role: MD}
};

function norm(s) {
  return String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase().replace(/[’'`]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
}
function cleanId(raw) {
  var id = "";
  try { id = decodeURIComponent(String(raw || "")); } catch (e) { id = String(raw || ""); }
  return id.replace(/^#/, "").trim().toUpperCase();
}
function has(id) { return Object.prototype.hasOwnProperty.call(REGISTRY, id); }

// Retourne {id, data, status}; status: empty | ok | notfound | mismatch
function check(rawId, rawName) {
  var id = cleanId(rawId), n = norm(rawName);
  if (!id && !n) return { status: "empty" };
  if (id) {
    if (!has(id)) return { status: "notfound", id: id };
    if (n && norm(REGISTRY[id].name) !== n) return { status: "mismatch", id: id };
    return { status: "ok", id: id, data: REGISTRY[id] };
  }
  for (var k in REGISTRY) {
    if (has(k) && norm(REGISTRY[k].name) === n) return { status: "ok", id: k, data: REGISTRY[k] };
  }
  return { status: "notfound", id: "" };
}

if (typeof document !== "undefined") {
  var out = document.getElementById("out");
  var add = function (cls, text) {
    var d = document.createElement("div");
    d.className = cls; d.textContent = text; out.appendChild(d);
  };
  var show = function (r) {
    out.textContent = "";
    if (r.status === "empty") { add("status", "Scannez le QR code du certificat"); return; }
    if (r.status === "ok") {
      add("status ok", "✔ Certificat authentique");
      add("name", r.data.name);
      add("label", "Type de certificat"); add("val", TYPE);
      if (r.data.role) { add("label", "Rôle"); add("val", r.data.role); }
      else { add("label", "Équipe"); add("val", r.data.team); }
    } else if (r.status === "mismatch") {
      add("status ko", "✘ Informations non concordantes");
      add("val", "Le nom ne correspond pas à ce numéro de série.");
    } else {
      add("status ko", "✘ Certificat introuvable");
      add("val", "Aucun certificat ne correspond à ces informations.");
    }
    if (r.id) add("serial", "N° " + r.id);
  };
  var codeEl = document.getElementById("code"), nmEl = document.getElementById("nm");
  document.getElementById("f").addEventListener("submit", function (e) {
    e.preventDefault();
    var r = check(codeEl.value, nmEl.value);
    show(r);
    if (r.status === "ok") { try { history.replaceState(null, "", "#" + r.id); } catch (x) {} }
  });
  var fromHash = function () {
    var id = cleanId(location.hash);
    if (id) codeEl.value = id;
    show(check(location.hash, ""));
  };
  window.addEventListener("hashchange", fromHash);
  fromHash();
}
</script>
</body>
</html>
